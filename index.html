<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ZEFIRO Studio Manager — gestionale interno di ZEFIRO Digital Studio.">
  <meta name="theme-color" content="#07152F">
  <meta name="color-scheme" content="dark">
  <title>ZEFIRO Studio Manager</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/views.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/crm.css">
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <div class="app" id="app" data-state="loading">
    <!-- Sidebar: generata da js/components/sidebar.js -->
    <aside class="sidebar" id="sidebar" aria-label="Navigazione principale"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <div class="shell">
      <!-- Topbar: generata da js/components/topbar.js -->
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="boot" id="boot" role="status" aria-live="polite">
          <img class="boot__logo" src="assets/img/brand/zefiro-simbolo-scuro.svg" alt="" width="56" height="40">
          <span>Avvio di Studio Manager…</span>
        </div>
      </main>
    </div>
  </div>

  <!-- Contenitori globali per modali e notifiche -->
  <div id="modal-root"></div>
  <div class="toast-region" id="toast-root" role="region" aria-label="Notifiche" aria-live="polite"></div>

  <noscript>
    <div class="noscript">ZEFIRO Studio Manager richiede JavaScript abilitato.</div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
